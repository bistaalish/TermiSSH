name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libudev-dev pkg-config tar xz-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App & Debian Bundle
        run: pnpm tauri build --bundles deb

      - name: Package Universal Linux Tarball (.tar.xz)
        run: bash scripts/package-tar-xz.sh

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release-dist
          cp TermiSSH-*.tar.xz release-dist/
          cp src-tauri/target/release/bundle/deb/TermiSSH_*_amd64.deb release-dist/
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: TermiSSH ${{ github.ref_name }}
          body_path: README.md
          draft: false
          prerelease: false
          files: |
            release-dist/*
